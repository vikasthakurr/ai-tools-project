services:
  - type: web
    name: text-to-sql
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt && python import_data.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: ./ecommerce.db
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: ACTIVE_PROMPT_VERSION
        value: "3"
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: "3.11.9"
